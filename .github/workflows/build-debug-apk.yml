# Stick Cricket Super Chase — one-click TEST APK build.
#
# How to use:
#   1. Open the repo on GitHub -> Actions tab -> "Build debug APK".
#   2. Click "Run workflow" (or just push to main).
#   3. Wait ~10-20 min. The APK is in the run's Artifacts as
#      "sadsha-cricket-debug-apk".
# The APK is a DEBUG build signed with AGP's default debug keystore
# (auto-generated on the runner — never the Play Store key).
# Real releases go through build-release-aab.yml with Qasim's keystore.

name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # The ubuntu runner already ships a full Android SDK. Do NOT use
      # android-actions/setup-android here: its built-in license-accept
      # step runs `sdkmanager --licenses` without piped input and fails
      # with exit code 1. Pipe `yes` ourselves instead.
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # NOTE: $GITHUB_PATH only applies to LATER steps, so use the full
          # sdkmanager path in this step.
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadsha-cricket-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
